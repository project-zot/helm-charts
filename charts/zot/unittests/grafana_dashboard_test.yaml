suite: test grafana dashboard configmap
templates:
  - grafana-dashboard.yaml
release:
  name: my-release
  namespace: registry
tests:
  - it: should be empty by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should not fail if grafanaDashboard is absent
    set:
      metrics.grafanaDashboard: null
    asserts:
      - hasDocuments:
          count: 0

  - it: should render the dashboard with the sidecar label
    set:
      metrics.grafanaDashboard.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: my-release-zot-grafana-dashboard
      - equal:
          path: metadata.namespace
          value: registry
      - equal:
          path: metadata.labels.grafana_dashboard
          value: "1"
      - isNull:
          path: metadata.annotations
      - matchRegex:
          path: data["zot-registry.json"]
          pattern: '"uid": "zot-registry"'

  - it: should use custom labels, annotations and namespace
    set:
      metrics.grafanaDashboard:
        enabled: true
        namespace: monitoring
        labels:
          dashboards: zot
        annotations:
          grafana_folder: Registry
    asserts:
      - equal:
          path: metadata.namespace
          value: monitoring
      - equal:
          path: metadata.labels.dashboards
          value: zot
      - equal:
          path: metadata.labels.grafana_dashboard
          value: "1"
      - equal:
          path: metadata.annotations.grafana_folder
          value: Registry

  - it: should drop the default label when set to null
    set:
      metrics.grafanaDashboard:
        enabled: true
        labels:
          grafana_dashboard: null
          dashboards: zot
    asserts:
      - isNull:
          path: metadata.labels.grafana_dashboard
      - equal:
          path: metadata.labels.dashboards
          value: zot
