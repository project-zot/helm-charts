suite: extra objects tests
templates:
  - extra-objects.yaml
release:
  name: my-release
tests:
  - it: should not render extra objects by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render an object unchanged
    set:
      extraObjects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: test-config
          data:
            foo: bar
    asserts:
      - isAPIVersion:
          of: v1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata
          value:
            name: test-config
      - equal:
          path: data
          value:
            foo: bar

  - it: should evaluate templates using the release context
    set:
      extraObjects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ .Release.Name }}-extra"
    asserts:
      - equal:
          path: metadata.name
          value: my-release-extra

  - it: should render multiple objects as separate documents
    set:
      extraObjects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: test-config
        - apiVersion: v1
          kind: Secret
          metadata:
            name: test-secret
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ConfigMap
        documentIndex: 0
      - isKind:
          of: Secret
        documentIndex: 1
